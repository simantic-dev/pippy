# UART: the good and the malicious peer on the same wiring, as two machines running
# YOUR firmware (not shipped). Run from this directory:
#   sim --scenario scenario.yaml --timeout 12
# Change mcu, bus, pins and baud to match your firmware.
machines:
  good:
    mcu: STM32H753IITX
    elf: firmware.elf
    parts:
      - { name: rc, type: uart-device, baud: 420000, script: good_crsf.py }
  malicious:
    mcu: STM32H753IITX
    elf: firmware.elf
    parts:
      - { name: rc, type: uart-device, baud: 420000, script: malicious_uart.py }
media:
  - { type: uart, connect: [good.uart4, good.rc] }
  - { type: uart, connect: [malicious.uart4, malicious.rc] }
