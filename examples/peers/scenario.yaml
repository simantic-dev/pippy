# Runs the three example peers against YOUR firmware. Run from this directory:
#   sim --scenario scenario.yaml --timeout 12 --frames frames.txt
# `firmware.elf` is not shipped: supply an STM32H753 image that configures a
# u-blox GPS on USART6 (230400), an ICM-42688-P on SPI1 (CS PC4) and an
# ICP-20100 on I2C2 (0x63). Change mcu, buses, pins and baud to match yours.
machines:
  dut:
    mcu: STM32H753IITX
    elf: firmware.elf
    parts:
      - { name: gps,  type: uart-device, baud: 230400, script: uart/good_gps.py }
      - { name: imu,  type: spi-device,  bus: spi1, cs: PC4, script: spi/good_icm42688.py }
      - { name: baro, type: i2c-device,  bus: i2c2, address: 0x63, script: i2c/good_icp20100.py }
media:
  - type: uart
    connect: [dut.usart6, dut.gps]
