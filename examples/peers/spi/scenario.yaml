# SPI: the good and the malicious peer on the same wiring, as two machines running
# YOUR firmware (not shipped). Run from this directory:
#   sim --scenario scenario.yaml --timeout 12
# Change mcu, bus, pins and baud to match your firmware.
machines:
  good:
    mcu: STM32H753IITX
    elf: firmware.elf
    parts:
      - { name: imu, type: spi-device, bus: spi1, cs: PC4, script: good_icm42688.py }
  malicious:
    mcu: STM32H753IITX
    elf: firmware.elf
    parts:
      - { name: imu, type: spi-device, bus: spi1, cs: PC4, script: malicious_icm42688.py }
