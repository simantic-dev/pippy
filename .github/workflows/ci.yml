# Tests every push and PR, and publishes to PyPI when a v* tag is pushed.
#
# Publishing uses PyPI Trusted Publishing (OIDC): the `pypi` environment
# exchanges this workflow's identity for a short-lived upload token, so there
# is no API token in repository secrets to leak or rotate. It must be
# configured once on PyPI before the first tagged release — see PUBLISHING.md.
#
# The SDK is pure Python and its tests need no simulator binary: the report
# fixtures are literal JSON in the shapes the schema allows, so CI stays
# independent of the engines this package drives.

name: ci

# DOCS ARE INERT. Prose-only commits compile nothing here. Safe only while main
# carries no required status checks — a path-filtered-away required check sits
# `Pending` forever and blocks the merge.
# (Actions does not support YAML anchors, hence the duplication.)
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # macOS dropped from CI entirely (ci: drop macOS, single-OS fixtures,
    # manual-only aux checks) — the SDK is pure Python, so a macOS runner
    # proved very little here that Linux does not, at 10x Linux's billing
    # rate. macOS is tested locally instead.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (tomllib landed there); 3.13 guards the top end.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python ${{ matrix.python }} --with pytest --with . pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      # Catches the metadata problems PyPI rejects on upload — a malformed
      # README, a bad classifier — while the tag can still be redone.
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing; nothing else is
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
