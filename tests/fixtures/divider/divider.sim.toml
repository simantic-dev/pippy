# A minimal testplan, here only so the enumeration tests have something real
# to read. It is not run: these tests never invoke analog-cli. The shapes that
# matter are a named [[test]], one with a nested [[test.measure]], and one
# without a name (which --only cannot address, so it is skipped).

[sim]
tstop = "10ms"

[[test]]
name = "schematic-erc"
kind = "erc"
max_warnings = 20

[[test]]
name = "netlist-sane"
kind = "netlist_sanity"

[[test]]
name = "rails-op"
kind = "op"

  [[test.measure]]
  name = "out-dc"
  signal = "V(OUT)"
  kind = "value_at"
  expect = { eq = 1.597, tol = "20m" }

[[test]]
kind = "drc"
